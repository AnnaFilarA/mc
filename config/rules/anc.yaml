# Активное шумоподавление. В тексте слово «да» не ищем (слишком частое) — только в значениях продавца (_seller).
# `**` — окончание до 8 букв.
_groups:
  Да: ["шумоподавл**", anc, "noise cancel**", "noise-cancel**", active noise]
  Нет: ["без шумоподавл**", "без активного шумоподавл**", без anc, no anc]
_seller:
  да: Да
  есть: Да
  yes: Да
  "true": Да
  "+": Да
  нет: Нет
  "no": Нет
  "false": Нет
  "-": Нет
  отсутствует: Нет
