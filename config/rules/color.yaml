# Цвета → канон схемы (русские, с заглавной, ё→е).
# Русские основы заданы регулярками с явными окончаниями (чтобы «серый» не ловил «сервис», «белый» — «белок»).
# E = (?:ый|ий|ая|яя|ое|ее|ые|ие|ого|его|ому|ему|ым|им|ых|их|ую|юю|ой|ей|ыми|ими)
_groups:
  Черный:
    - 're:ч[её]рн(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - black
    - onyx
    - obsidian
    - titanium black
    - phantom black
  Белый:
    - 're:бел(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - 're:белоснежн(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - white
    - titanium white
  Серый:
    - 're:сер(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - серый космос
    - титановый серый
    - gray
    - grey
    - graphite
    - 're:графитов(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - космический серый
    - space gray
    - space grey
    - titanium gray
    - titanium grey
    - 're:стальн(?:ой|ая|ое|ые|ого|ому|ым|ых|ую|ыми)'
  Серебристый:
    - 're:серебрист(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - 're:серебрян(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - silver
  Синий:
    - 're:син(?:ий|яя|ее|ие|его|ему|им|их|юю|ей|ими)'
    - blue
    - navy
  Голубой:
    - 're:голуб(?:ой|ая|ое|ые|ого|ому|ым|ых|ую|ыми)'
    - 're:небесн(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - light blue
    - sky blue
  Зеленый:
    - 're:зел[её]н(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - 're:оливков(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - green
  Красный:
    - 're:красн(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - red
  Золотой:
    - 're:золот(?:ой|ая|ое|ые|ого|ому|ым|ых|ую|ыми)'
    - 're:золотист(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - gold
  Розовый:
    - 're:розов(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - pink
    - rose gold
    - розовое золото
  Фиолетовый:
    - 're:фиолетов(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - 're:сиренев(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - 're:лавандов(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - purple
    - violet
    - lavender
  Бежевый:
    - 're:бежев(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - beige
  Желтый:
    - 're:жёлт(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - 're:желт(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ыми)'
    - yellow
