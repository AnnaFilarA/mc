# Процессоры. Голый «i5» слабее (-0.13 → 0.82): без слова «Core» бывает неоднозначным.
# Чипы Apple M1..M4: поправка -0.1, не срабатывают на «M.2» и «M2 SSD».
_groups:
  Intel Core i3: [core i3, intel core i3]
  Intel Core i5: [core i5, intel core i5]
  Intel Core i7: [core i7, intel core i7]
  Intel Core i9: [core i9, intel core i9]
  Intel Core Ultra 5: [core ultra 5, intel core ultra 5]
  Intel Core Ultra 7: [core ultra 7, intel core ultra 7]
  Intel Celeron: [celeron, селерон]
  Intel Pentium: [pentium, пентиум]
  AMD Ryzen 3: [ryzen 3, ryzen ai 3, райзен 3]
  AMD Ryzen 5: [ryzen 5, ryzen ai 5, райзен 5]
  AMD Ryzen 7: [ryzen 7, ryzen ai 7, райзен 7]
  AMD Ryzen 9: [ryzen 9, ryzen ai 9, райзен 9]
  Apple M1: [apple m1]
  Apple M2: [apple m2]
  Apple M3: [apple m3]
  Apple M4: [apple m4]
i3: [Intel Core i3, -0.13]
i5: [Intel Core i5, -0.13]
i7: [Intel Core i7, -0.13]
i9: [Intel Core i9, -0.13]
're:m1(?![\w.]|\s*(?:ssd|nvme))': [Apple M1, -0.1]
're:m2(?![\w.]|\s*(?:ssd|nvme))': [Apple M2, -0.1]
're:m3(?![\w.]|\s*(?:ssd|nvme))': [Apple M3, -0.1]
're:m4(?![\w.]|\s*(?:ssd|nvme))': [Apple M4, -0.1]
